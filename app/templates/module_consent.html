<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AirTrack — {{ module.title or module.name }}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      background: #0a0a0a;
      color: #e6e6e6;
      font-family: system-ui, sans-serif;
      padding: 24px;
      max-width: 720px;
    }

    .page-header {
      display: flex;
      align-items: baseline;
      gap: 16px;
      margin-bottom: 24px;
      border-bottom: 1px solid #1e1e1e;
      padding-bottom: 14px;
    }
    .page-header h1 { margin: 0; font-size: 1.3rem; color: #00ff66; letter-spacing: .5px; }
    .back-link {
      margin-left: auto;
      color: #00ff66;
      text-decoration: none;
      font-size: 0.85rem;
      border: 1px solid #1e3a1e;
      padding: 5px 12px;
      border-radius: 6px;
    }
    .back-link:hover { background: #0f2a0f; }

    .consent-box {
      background: #111;
      border: 1px solid #222;
      border-radius: 10px;
      padding: 22px 24px;
    }

    .consent-text {
      font-size: 0.9rem;
      line-height: 1.65;
      color: #ccc;
      white-space: pre-line;
    }

    .consent-actions {
      margin-top: 22px;
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .btn-confirm {
      padding: 9px 18px;
      font-size: 0.88rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      border: 1px solid #1e3a1e;
      background: transparent;
      color: #00cc44;
    }
    .btn-confirm:hover { background: #0f2a0f; border-color: #00cc44; }

    .btn-cancel {
      padding: 9px 18px;
      font-size: 0.88rem;
      border-radius: 6px;
      cursor: pointer;
      border: 1px solid #2a2a2a;
      background: transparent;
      color: #888;
      text-decoration: none;
      display: inline-block;
    }
    .btn-cancel:hover { background: #1a1a1a; color: #ccc; border-color: #444; }
  </style>
</head>
<body>

  <div class="page-header">
    <h1>{{ module.title or module.name }}</h1>
    <a href="{{ url_for('admin.modules_page') }}" class="back-link">← Modules</a>
  </div>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <ul class="flash-list" style="list-style:none; margin:0 0 20px; padding:0;">
        {% for category, message in messages %}
          <li style="padding:8px 14px; border-radius:6px; font-size:0.88rem; margin-bottom:6px; background:rgba(204,68,68,0.1); border:1px solid rgba(204,68,68,0.3); color:#ff6666;">{{ message }}</li>
        {% endfor %}
      </ul>
    {% endif %}
  {% endwith %}

  <div class="consent-box">
    <div class="consent-text">{{ module.consent_text or module.description }}</div>

    <form method="POST" action="{{ url_for('admin.modules_consent', folder=module.folder) }}" class="consent-actions">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <button type="submit" class="btn-confirm">I understand, enable {{ module.title or module.name }}</button>
      <a href="{{ url_for('admin.modules_page') }}" class="btn-cancel">Cancel</a>
    </form>
  </div>

</body>
</html>
